name: VOX Avengers booking check

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-bookings:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 playwright

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Check VOX showtimes and notify Telegram
        run: python check.py
        env:
          TOKEN: ${{ secrets.TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

      - name: Save seen booking links
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add booking_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update seen VOX booking links"
            git push
          fi
